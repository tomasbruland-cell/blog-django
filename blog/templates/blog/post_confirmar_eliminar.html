{% extends 'blog/base.html' %}
{% block content %}
<h1>Eliminar post</h1>

<p>¿Seguro que querés eliminar "{{ post.titulo }}"? Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'detalle_post' post.pk %}">Cancelar</a>
{% endblock %}
