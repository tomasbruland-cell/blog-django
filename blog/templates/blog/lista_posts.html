{% extends 'blog/base.html' %}
{% block content %}
<h1>Mi Blog</h1>

{% for post in posts %}
    <article>
        <h2><a href="{% url 'detalle_post' post.pk %}">{{ post.titulo }}</a></h2>
        <p>Por {{ post.autor.username }} - {{ post.fecha }}</p>
        {% if post.imagen %}
            <img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" width="300">
        {% endif %}
        <p>{{ post.contenido }}</p>
    </article>
{% empty %}
    <p>Todavía no hay posts.</p>
{% endfor %}
{% endblock %}
